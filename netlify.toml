# استضافة Netlify: يكفي ربط المستودع وسيقرأ هذه الإعدادات تلقائيًا.
# لموقع الطلاب المستقل أنشئ موقعًا ثانيًا من المستودع نفسه وأضف متغير البيئة SITE=student
# (ولموقع المعلمين SITE=teacher) فيُبنى كل موقع وحده برابطه الخاص.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
